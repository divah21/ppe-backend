# nginx site for ppesystem.eurekasystems.biz (Windows server).
# One domain for the app and the API, so v2 session cookies stay first-party.
# Reconcile certificate paths and ports with the live config before replacing it.

upstream ppe_web { server 127.0.0.1:3000; keepalive 16; keepalive_timeout 30s; }
upstream ppe_api { server 127.0.0.1:5000; keepalive 16; keepalive_timeout 30s; }

server {
    listen 80;
    server_name ppesystem.eurekasystems.biz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ppesystem.eurekasystems.biz;

    ssl_certificate     C:/nginx/ssl/ppesystem.crt;
    ssl_certificate_key C:/nginx/ssl/ppesystem.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    server_tokens off;
    proxy_hide_header X-Powered-By;
    client_max_body_size 15m;

    # Next compresses its own output; this covers the API's JSON
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://ppe_api;
        proxy_read_timeout 120s;
    }

    location /_next/static/ {
        proxy_pass http://ppe_web;
        # A location with its own add_header inherits none from the server block, so repeat them.
        # helmet already sends anti-framing headers for /api, which is why they live here only.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://ppe_web;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}
